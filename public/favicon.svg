<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="etGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006633" />
      <stop offset="50%" stop-color="#004d26" />
      <stop offset="100%" stop-color="#002b15" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F5B700" />
      <stop offset="100%" stop-color="#D48800" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#D81E05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F5B700" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#etGrad)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" stroke-dasharray="12 8"/>
  
  <!-- Golden Flight Wings -->
  <g filter="url(#glow)">
    <!-- Left Wing -->
    <path d="M70 240 C 130 190, 210 190, 240 260 C 190 260, 130 280, 80 320 C 100 290, 80 260, 70 240 Z" fill="url(#goldGrad)"/>
    <path d="M100 220 C 150 170, 220 170, 246 230 C 200 235, 150 250, 110 280 Z" fill="#FFEAA7" opacity="0.8"/>
    
    <!-- Right Wing -->
    <path d="M442 240 C 382 190, 302 190, 272 260 C 322 260, 382 280, 432 320 C 412 290, 432 260, 442 240 Z" fill="url(#goldGrad)"/>
    <path d="M412 220 C 362 170, 292 170, 266 230 C 312 235, 362 250, 402 280 Z" fill="#FFEAA7" opacity="0.8"/>
  </g>
  
  <!-- Center Star / Aircraft Badge -->
  <circle cx="256" cy="256" r="64" fill="url(#redAccent)" stroke="url(#goldGrad)" stroke-width="8"/>
  
  <!-- Jet Silhouette in Center -->
  <path d="M256 215 L264 245 L288 255 L264 260 L266 280 L256 275 L246 280 L248 260 L224 255 L248 245 Z" fill="#FFFFFF"/>
</svg>
